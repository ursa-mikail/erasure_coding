version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: erasure-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/status"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - erasure-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: erasure-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - erasure-net

networks:
  erasure-net:
    driver: bridge
